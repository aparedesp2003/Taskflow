<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Indigo gradient: top-left → bottom-right -->
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <!-- Top shine overlay -->
    <linearGradient id="shine1" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="70%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="114" fill="url(#bg1)"/>
  <!-- Subtle top-left shine -->
  <rect width="512" height="300" rx="114" fill="url(#shine1)"/>

  <!-- T — crossbar (horizontal beam) -->
  <rect x="84" y="146" width="344" height="80" rx="20" fill="white"/>
  <!-- T — stem (vertical beam, same top as crossbar) -->
  <rect x="216" y="146" width="80" height="234" rx="20" fill="white"/>
</svg>
