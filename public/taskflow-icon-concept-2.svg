<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep navy background -->
    <radialGradient id="bg2" cx="35%" cy="30%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0F0E1A"/>
    </radialGradient>
    <!-- Indigo glow behind the check -->
    <radialGradient id="glow2" cx="50%" cy="55%" r="48%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <!-- Arrowhead fill -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="114" fill="url(#bg2)"/>
  <!-- Soft indigo center glow -->
  <rect width="512" height="512" rx="114" fill="url(#glow2)"/>

  <!--
    Flowing check + directional arrow at the tip.
    The entry curves from the left (quadratic bezier = smooth "flow in"),
    descends to the vertex, then rises to the right where an arrowhead caps it.
  -->

  <!-- Check body: smooth entry curve → vertex → upward stroke -->
  <path
    d="M 88,296 Q 150,232 220,366 L 404,148"
    fill="none"
    stroke="white"
    stroke-width="72"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Arrowhead at top-right tip (two small lines) -->
  <polyline
    points="364,130 404,148 382,184"
    fill="none"
    stroke="white"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
