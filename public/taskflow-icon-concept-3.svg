<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Violet → indigo gradient background -->
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <!-- Top-left shine -->
    <linearGradient id="shine3" x1="0" y1="0" x2="0.6" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Inner bolt highlight (lighter center) -->
    <linearGradient id="boltFill" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="114" fill="url(#bg3)"/>
  <!-- Shine overlay (top-left quadrant) -->
  <rect width="512" height="320" rx="114" fill="url(#shine3)"/>

  <!--
    Lightning bolt — 6-point filled polygon.
    The two arms are parallel (same slope), giving a clean classic bolt.
    Non-self-intersecting, verified by parametric line equations.

    Upper arm: (304,52)→(140,286) on the left, (274,248)→(304,52) on the right
    Waist:     (140,286)→(238,264) bottom; (372,226)→(274,248) top
    Lower arm: (238,264)→(208,460) on the left, (208,460)→(372,226) on the right
  -->
  <polygon
    points="304,52 140,286 238,264 208,460 372,226 274,248"
    fill="url(#boltFill)"
  />
</svg>
